<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Mensajería">
    <meta property="og:url" content="https://mensajes-38hh.onrender.com/">
    <meta property="og:image" content="./img/iphone.webp">
    <meta property="og:description" content="Conecta tus mensajes">
    <meta name="description" content="Conecta tus mensajes">
    <title>Mensajería</title>
    <link rel="shortcut icon" href="/img/megaphone.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <section class="container">
        <header class="header-style">

            <div class="content-menu mt-15">
                <img src="/img/menu.svg" alt="" id="menu">
            </div>

            <nav id="nav" class="navStyle">
                <div class="ml-30">
                    <ul>
                        <img src="/img/megaphone.svg" alt="logo">
                    </ul>
                </div>

                <div class="mr-30">
                    <ul class="ulStyle">
                        <li>Características</li>
                        <li>Documentos</li>
                        <li>Acerca de</li>
                        <li>Ayuda</li>
                        <li>Carreras</li>
                        <li>Precios</li>
                        <li>Login</li>
                    </ul>
                </div>
            </nav>

        </header>

        <aside>


            <div class="flexWrapCenter">

                <div class="content">

                    <article class="chat formBg">

                        <ul id="chat" class="messages"></ul>
                        <form  class="form" id="message-box">

                            <input type="text" id="chat-message" class="input input65" autocomplete="off"
                                placeholder="Escribe un mensaje">
                            <button type="submit" class="firstButton">
                                <img src="/img/send.svg" alt="">
                            </button>
                        </form>
                    </article>

                </div>
                <div class="content">

                    <article class="chat formBg">
                        <ul id="chatBrother" class="messages"></ul>

                        <form  class="form" id="message-box-brother">

                            <input type="text" name="message" class="input input65" id="chat-message-brother"
                                placeholder="Escribe un mensaje" autocomplete="off" >
                            <button type="submit" class="secondButton">
                                <img src="/img/send.svg" alt="">

                            </button>

                        </form>

                    </article>
                </div>
            </div>

        </aside>



        <main>
        </main>
        <footer></footer>
    </section>



    <!-- script -->
    <script src="/js/jquery.js"></script>
    <script src="/js/sweetAlert.js"></script>
    <script src="/socket.io/socket.io.js" charset="UTF-8"></script>
    <script src="/js/main.js"></script>
    <script type="module">
        $(document).ready(function () {

            let component = `
    <div class="component"> 
            <span>Características</span>
            <span>Documentos</span>
            <span>Acerca de</span>
            <span>Ayuda</span>
            <span>Carreras</span>
            <span>Precios</span>
            <span>Login</span>
    </div>

            `;

            $('#menu').on('click', async function () {
                await Swal.fire({
                    html: `${component}`,
                    position: 'top-end',
                    showClass: {
                        popup: `
              animate__animated
              animate__fadeInLeft
              animate__faster
            `,
                    },
                    hideClass: {
                        popup: `
              animate__animated
              animate__fadeOutLeft
              animate__faster
            `,
                    },
                    grow: 'column',
                    width: 300,
                    background: '#7a3576',
                    showConfirmButton: false,
                    showCloseButton: true,
                })



            })

        })

    </script>
    <!-- script -->
</body>

</html>
